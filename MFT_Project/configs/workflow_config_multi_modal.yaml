# Qlib workflow template for the Multi-Modal Finance Toolkit project.
# It wires synthetic static data, the multi-modal dataset wrapper, and the
# PyTorch fusion model. Adjust the segments and hyper-parameters to suit larger
# experiments.

qlib_init:
  provider_uri: MFT_Project/data
  region: cn

task:
  dataset:
    class: MultiModalDataset
    module_path: MFT_Project.dataset.multimodal
    kwargs:
      handler:
        class: qlib.data.dataset.handler.DataHandlerLP
        module_path: qlib.data.dataset.handler
        kwargs:
          instruments: null
          start_time: "2023-01-02"
          end_time: "2023-06-30"
          data_loader:
            class: StaticDataLoader
            module_path: qlib.data.dataset.loader
            kwargs:
              config: MFT_Project/data/static_market_data.pkl
      segments:
        train: ["2023-01-02", "2023-03-31"]
        valid: ["2023-04-01", "2023-05-15"]
        test: ["2023-05-16", "2023-06-30"]
      text_feature_path: MFT_Project/data/dummy_text_features.pkl
      lazy_text_loading: true

  model:
    class: FusionModel
    module_path: MFT_Project.model.fusion
    kwargs:
      market_dim: 7
      text_dim: 256
      market_hidden_dims: [256, 128]
      text_hidden_dims: [256]
      fusion_hidden_dims: [128]
      activation: relu
      dropout: 0.1
      lr: 0.001
      weight_decay: 0.0
      n_epochs: 50
      batch_size: 4096
      patience: 5
      loss: mse

