qlib_init:
  provider_uri: MFT_Project/data
  region: cn

task:
  dataset:
    class: MultiModalDataset
    module_path: MFT_Project.data.dataset
    kwargs:
      handler:
        class: "qlib.data.dataset.handler.DataHandlerLP"
        module_path: qlib.data.dataset.handler
        kwargs:
          instruments: null
          start_time: "2023-01-02"
          end_time: "2023-01-06"
          data_loader:
            class: StaticDataLoader
            module_path: qlib.data.dataset.loader
            kwargs:
              config:
                feature: "MFT_Project/data/static_market_data.pkl"
      segments:
        train: ["2023-01-02", "2023-01-04"]
        valid: ["2023-01-05", "2023-01-05"]
        test: ["2023-01-06", "2023-01-06"]
      text_feature_path: "MFT_Project/data/dummy_text_features.pkl"
      # 其他 MultiModalDataset 需要的参数可在此补充

  model:
    class: FusionTransformer
    module_path: MFT_Project.model.fusion_model
    kwargs:
      market_dim: 7           # 输入特征维度，根据实际情况修改
      text_dim: 256             # 文本特征维度，根据实际情况修改
      num_layers: 4             # Transformer 层数
      num_heads: 8              # 多头注意力头数
      hidden_dim: 512           # 隐藏层维度
      dropout: 0.1              # Dropout 比例
      lr: 0.001                 # 学习率
      # 其他 FusionTransformer 需要的参数可在此补充

# 你可以根据实际需求继续补充 dataset 和 model 的 kwargs 参数

